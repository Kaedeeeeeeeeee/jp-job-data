[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jpjobs"
version = "0.2.0"
description = "Unified scraper for Japan's major job boards, with AI-assistant integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["japan", "jobs", "scraper", "hellowork", "indeed", "linkedin", "tokyodev", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jpjobs = "jpjobs.cli:main"

[tool.hatch.build]
include = ["jpjobs/**/*.py", "README.md", "USAGE.md", "AGENTS.md", "LICENSE"]
