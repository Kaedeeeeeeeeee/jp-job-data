[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jpjobs"
version = "0.4.0"
description = "Quality-focused multi-source scraper for Japan job boards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["japan", "jobs", "scraper", "hellowork", "indeed", "linkedin", "tokyodev", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.40",
]

[project.urls]
Repository = "https://github.com/Kaedeeeeeeeeee/jp-job-data"
Documentation = "https://github.com/Kaedeeeeeeeeee/jp-job-data/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8,<0.16"]

[project.scripts]
jpjobs = "jpjobs.cli:main"

[tool.hatch.build]
include = ["jpjobs/**/*.py", "README.md", "USAGE.md", "AGENTS.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
