<html lang="zh-CN">

  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #657169;
      --line: #dce4de;
      --paper: #fbfcf8;
      --panel: #ffffff;
      --green: #146c43;
      --green-soft: #e4f4ea;
      --amber: #936214;
      --amber-soft: #fff3d6;
      --red: #a33a32;
      --red-soft: #fde8e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    button, input, textarea, select { font: inherit; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 252, 248, .96);
      backdrop-filter: blur(12px);
    }
    .header-inner { padding: 18px 0 14px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); letter-spacing: -.03em; }
    .subtitle { color: var(--muted); margin-top: 4px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(170px, 240px) auto auto;
      gap: 10px;
      margin-top: 14px;
    }
    select, .action {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 12px;
    }
    .action { cursor: pointer; font-weight: 650; }
    .action.primary { background: var(--ink); color: white; border-color: var(--ink); }
    .progress-track {
      height: 7px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8ece8;
    }
    .progress-bar { height: 100%; width: 0; background: var(--green); transition: width .2s; }
    .source-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 18px 0 8px; }
    .source-tab {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      padding: 7px 11px;
      cursor: pointer;
    }
    .source-tab.active { color: white; background: var(--ink); border-color: var(--ink); }
    .source-tab small { opacity: .72; }
    main { padding: 12px 0 70px; }
    .empty {
      padding: 48px 24px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }
    .card {
      margin: 16px 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(23, 33, 27, .04);
    }
    .card[data-status="correct"] { border-left: 5px solid var(--green); }
    .card[data-status="issue"] { border-left: 5px solid var(--red); }
    .card[data-status="unsure"] { border-left: 5px solid var(--amber); }
    .eyebrow { color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .title-row { display: flex; gap: 16px; align-items: start; justify-content: space-between; }
    h2 { margin: 3px 0 2px; font-size: 21px; line-height: 1.3; }
    .company { color: var(--muted); font-weight: 600; }
    .source-link {
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--ink);
      color: white;
      padding: 8px 11px;
      text-decoration: none;
      font-weight: 700;
    }
    .facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .fact { padding: 10px 12px; border-radius: 10px; background: #f4f6f2; }
    .fact span { display: block; color: var(--muted); font-size: 12px; }
    .description { color: #3e4842; font-size: 14px; }
    .review {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, .7fr);
      gap: 16px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .status-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .status {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      padding: 8px 11px;
      cursor: pointer;
    }
    .status.selected[data-value="correct"] { background: var(--green-soft); border-color: var(--green); }
    .status.selected[data-value="issue"] { background: var(--red-soft); border-color: var(--red); }
    .status.selected[data-value="unsure"] { background: var(--amber-soft); border-color: var(--amber); }
    .issues { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 12px; }
    .issues label { font-size: 13px; }
    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .hidden { display: none !important; }
    @media (max-width: 800px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      .facts { grid-template-columns: 1fr 1fr; }
      .review { grid-template-columns: 1fr; }
      .title-row { display: block; }
      .source-link { display: inline-block; margin-top: 12px; }
    }
  </style>
</head>

 "Requirements French: Fluent Visa sponsorship available Description 【 Recherche professeurs de français, travail à domicile via Zoom (quel que soit le pays où vous habitez) 】 Notre entreprise « Ensemble en Français » est une école de français en ligne utilisant Zoom pour dispenser des cours en ligne aux apprenants japonais vivant dans le monde entier. Depuis l'ouverture de l'école en février 2010, le nombre d'élèves a continué d'augmenter chaque année, ce qui a entraîné un recrutement permanent de professeurs de français (Japonais ou natifs de langue française). Vous pouvez obtenir un revenu régulier en proposant des cours de français via Zoom à l’heure de votre choix et depuis votre domicile. ------------------------------------------------------- 1. Récapitulatif : ・ Cours particuliers de français sur Zoom. ・ Enseigner principalement à des adultes (vous pouvez aussi enseigner aux enfants si vous le souhaitez). ・ Vous pouvez dispenser vos cours depuis votre domicile à n’importe quelle heure de la journée, 24h sur 24. ・ Votre emploi du temps n’a pas besoin d’être fixe, vous pouvez le changer à votre guise selon vos disponibilités (à condition que vous puissiez fournir au moins 10 leçons (50 minutes x 10) par semaine). ・ Avant votre début officiel en tant qu'instructeur, vous devrez passer un stage rémunéré (1000 yens pour 50 minutes de cours). La durée de la formation varie en fonction de l'expérience de l'instructeur. En règle générale, le temps de formation requis pour les enseignants expérimentés est de 6 à 20 heures. ・ Au cours de la formation, nous vous renseignerons de manière simple et compréhensible des méthodes d’enseignement sur Zoom ayant fait leurs preuves au sein de notre école, et des astuces afin de dispenser des cours de haut niveau en tant que professeurs de français. ・ En plus des cours sur Zoom, les personnes ayant un niveau professionnel de japonais et pouvant participer au travail de bureau de l’école et aux relations publiques, pourront obtenir une rémunération supplémentaire. ・ Pour ceux qui ont un visa étudiant et remplissent certaines conditions telles que le nombre de leçons et le degré de contribution à l'école, un visa de travail peut être sponsorisé par l’école. ------------------------------------------------------ 2. Rémunération : 1,500〜2,200 JPY / un cours de 50mn. 50,000〜450,000 JPY / mois selon le nombre de cours ------------------------------------------------------ 3. Compétences et personnalité requises par notre école : ・ Avoir au moins 3 mois d’expérience dans l’enseignement du français (vous pouvez être dispensé de cette condition si vous avez de l'expérience en tant que professeur d'anglais ou autre) ・ Aimer enseigner le français, être très motivé et avoir le sens des responsabilités. ------------------------------------------------------ 4. Les avantages à travailler au sein de notre école : ・ Vous pouvez travailler à domicile quel que soit le pays où vous habitez, il n'y a donc aucune perte de temps. ・ La possibilité d’obtenir un revenu stable et élevé en augmentant le nombre d'étudiants réguliers. ・ De nombreux instructeurs ont gagné un revenu élevé après leur début officiel, en fonction de leurs efforts et de leur croissance au cours de la formation, bien qu'ils n'avaient que peu d’expérience en tant que professeur jusque-là. ・ Ce travail vous apporte non seulement l’opportunité de travailler en parallèle de votre occupation principale mais aussi d’en faire votre principal emploi, la plupart des instructeurs travaillent depuis longtemps dans notre l’école. Nous sommes fiers de la longueur de leur carrière chez nous. ・ Nous veillons à ce que le personnel administratif soutienne l'instructeur avec soin, afin de maintenir un niveau élevé de leçons et d’assurer un nombre stable d'élèves. ------------------------------------------------------ 5. Le profil recherché est le suivant : ・ Posséder un compte bancaire japonais ・ (Si vous habitez à l’étranger) posséder un compte bancaire pouva e. Winters are snowy, with over a meter of snowfall being common, so you'll experience a true Japanese winter. Because of the village's remote location, driving is essential, and larger supermarkets are approximately 90 minutes away. One major advantage of this position is that the Board of Education provides subsidized housing, resulting in lower rent than many other ALT positions and allowing you to save more each month. ---Key Qualifications--- ▲ Native English speaker ▲ Bachelor's degree (or higher) ▲ Engaging, enthusiastic, and dedicated to providing a positive communicative experience for students ▲ Flexible, sociable, culturally sensitive, and eager to live in Japan for a minimum of one year ▲ Previous teaching experience ranging from ALT to ESL tutoring within Japan or in other countries ▲ Conversational Japanese ability required ▲ Previous time spent studying or working in Japan is appreciated but not required ▲ Driving required ---What We Offer--- We want to support your growth and development to become a great ALT. The skills and experiences you will gain with us, will greatly benefit you in various ways for your future career. But don’t take our word for it, see for yourself what others say on sites like Glassdoor and Reddit. ---Benefits--- ▲ Full salary every month, no prorated months, paid on-time every time ▲ Outstanding and reliable support from Supervisors and staff ▲ Comprehensive benefits package with paid Annual Leave days ▲ Housing support: we pay key money and deposit for company sponsored apartments so you don’t have to ▲ Reimbursements: public transportation, bicycle, and more ▲ Driving support: we pay for the car lease and offer a variety of driving plans to suit your needs (up to and including fully paid plans where we pay gas, insurance, maintenance, etc.), and more ▲ Industry-leading training: tailored to your needs, taught by highly skilled trainers, hands-on, ongoing year-round, and professional development for your future career ▲ Resources and materials: access to top-quality educational resources anytime through our members website including storyboards, flashcards, songs, example lesson plans and more ▲ Visa Sponsorship ---The Role--- An ALT’s work in public schools centers around creating positive interactions with the students both inside and outside the classroom and helping to provide enjoyable and energetic lessons. ALTs also develop and maintain a positive and supportive professional relationship with Japanese teachers by assisting with various tasks during the school year. ALTs will experience prolonged periods of standing, walking, and stair climbing. ALTs will also be encouraged to perform high energy movements such as running and playing with students. To help you find success in this role, our ALTs are frequently evaluated throughout the year based on their lesson’s clarity, how supportive they are, and the overall atmosphere they help to create in the classroom. We are dedicated to helping our ALTs grow and improve for their future success by offering ongoing advice, feedback, and more. Working as an ALT is a great opportunity to improve your Japanese language ability, experience and appreciate cultural differences, and most importantly, to be positively involved with the development and well-being of Japanese students. ---The Application Process--- Once we receive your resume and cover letter, we will only reply to qualified applicants via email. Those that pass our subsequent screening questionnaire will then be invited to an interview. All of our interviews are conducted virtually using Google Meet. If you are interested in applying, please visit our Recruiting website for further details about ALTIA CENTRAL.", "description_snippet": "Requirements English: Native level Japanese: Conversational Must currently reside in Japan Visa sponsorship available Description ALTIA CENTRAL is now accepting applications from all candidates currently living in Japan to join our fantastic team o opment through play, conversation, and daily care. Who this job is for This position suits someone patient, reliable, and comfortable working closely with young children. It is a good match for candidates with experience in childcare, nursery care, preschool, kindergarten, babysitting, nanny work, pediatric care, or classroom support. English fluency is required. Japanese ability is helpful, but not required. Preference is given to candidates already living in Japan. Pay, schedule, and benefits Salary: ¥200,000 to ¥250,000 per month, negotiable based on experience and qualifications. Schedule: Monday to Friday, 8 hours per day, 40 hours per week. Insurance: health, social, and employment insurance. Transportation allowance: up to ¥20,000 per month. Bonus: performance-based bonus available. Training: continuing professional development opportunities. Holidays: Saturdays, Sundays, national holidays, annual paid leave, and about two weeks of school holidays. If you want a full-time childcare job in Tokyo where English is used daily and young children are at the center of the work, Laurus would like to hear from you. Note Under the Act on Measures for the Prevention of Sexual Violence Against Children by School Establishers and Private Educational and Childcare Service Providers (Act No. 69 of 2024; hereinafter referred to as the “Child Sexual Violence Prevention Act”), which is scheduled to come into force by December 25, 2026, individuals engaged in those positions will be subject to a criminal record verification process under the Child Sexual Violence Prevention Act to confirm whether they have any convictions for specified sexual offenses. Therefore, as part of the recruitment and selection process, we will verify whether applicants have any convictions for specified sexual offenses through a declaration, résumé/CV, and/or other relevant documentation. We appreciate your understanding in advance.", "description_snippet": "Job Requirements Required English Level: Fluent Required Japanese Level: Not necessary Current Residence Requirement: Japan Visa Sponsorship: Future possibility / Renewal Required Fluent English communication skills. A caring, patient, and responsible attitude toward young children. Ability to work as part of a team and support a homeroom teacher or lead caregiver. Comfort helping with daily child", "workplace": "東京都, 港区, リズ白金台 17", "prefecture": "tokyo", "prefecture_name": "Tokyo", "city": null, "remote": false, "wage": {"min": 200000, "max": 250000, "unit": "monthly", "raw": "JPY 200000 250000 MONTH"}, "employment_type": "fulltime", "date_posted": "2026-07-17", "language": ["english", "japanese"], "matched_keyword": null, "scraped_at": "2026-07-23T04:35:05Z", "source_urls": {"jobsinjapan": "https://jobsinjapan.com/jobs/1700034/nursery-support-teacher-childcare-assistant-at-stem-international-school-in-tokyo-minato-ku-2/"}, "source_ids": {"jobsinjapan": "1700034"}, "detail_status": "enriched", "quality_flags": [], "first_seen_at": null, "last_seen_at": null}, {"id": "53c9d695785e6104", "source": "jobsinjapan", "source_id": "1700032", "url": "https://jobsinjapan.com/jobs/1700032/ryko-spa-winter-seasonal-spa-therapist/", "found_on": ["jobsinjapan"], "title": "Ryko Spa - Winter Seasonal Spa Therapist", "company": "HTM", "description": "Job Requirements Required English Level: Business Level Required Japanese Level: Not necessary Current Residence Requirement: None Visa Sponsorship: No At least 2 years experience in a spa or massage environment desirable. Applications welcome from confident and passionate therapists, even with less than 2 years experience. Excellent presentation, communication and interpersonal skills. Strong desire to be part of a united team and community. Excellent attention to detail, as well as impeccable grooming and presentation. Excellent time management skills & ability to adapt & personalize treatments to guest's concerns. Ability to remain calm under pressure and great problem solvin   <script>
    const data = JSON.parse(document.getElementById("audit-data").textContent);
    const storageKey = `jpjobs-audit:${data.scanned_at || "unknown"}`;
    const issueLabels = {
      title: "标题", company: "公司", date_posted: "日期", workplace: "地点",
      wage: "薪资", employment_type: "雇佣类型", description: "描述",
      duplicate: "疑似重复", inactive: "已失效"
    };
    let reviews = JSON.parse(localStorage.getItem(storageKey) || "{}");
    let activeSource = "all";

    const escapeText = value => value === null || value === undefined || value === "" ? "—" : String(value);
    const wageText = job => {
      const wage = job.wage || {};
      return wage.raw || [wage.min, wage.max, wage.unit].filter(Boolean).join(" / ") || "—";
    };
    const jobKey = job => `${job.source}:${job.source_id || job.id}`;
    const save = () => localStorage.setItem(storageKey, JSON.stringify(reviews));

    function sourceOptions() {
      const select = document.getElementById("sourceFilter");
      select.innerHTML = "";
      const all = document.createElement("option");
      all.value = "all";
      all.textContent = `全部平台（${data.jobs.length} 条样本）`;
      select.appendChild(all);
      for (const source of data.sources) {
        const option = document.createElement("option");
        option.value = source.source;
        option.textContent = `${source.source}（抽 ${source.sampled} / 共 ${source.available}）`;
        select.appendChild(option);
      }
    }

    function renderTabs() {
      const tabs = document.getElementById("sourceTabs");
      tabs.innerHTML = "";
      const items = [{source: "all", sampled: data.jobs.length}, ...data.sources];
      for (const source of items) {
        const button = document.createElement("button");
        button.className = "source-tab" + (activeSource === source.source ? " active" : "");
        button.dataset.source = source.source;
        button.innerHTML = `${source.source === "all" ? "全部" : source.source} <small>${source.sampled}</small>`;
        button.onclick = () => {
          activeSource = source.source;
          document.getElementById("sourceFilter").value = activeSource;
          render();
        };
        tabs.appendChild(button);
      }
    }

    function setStatus(job, value) {
      const key = jobKey(job);
      reviews[key] ||= {issues: [], notes: ""};
      reviews[key].status = value;
      reviews[key].reviewed_at = new Date().toISOString();
      save();
      render();
    }

    function updateIssue(job, issue, checked) {
      const key = jobKey(job);
      reviews[key] ||= {status: "issue", issues: [], notes: ""};
      const issues = new Set(reviews[key].issues || []);
      checked ? issues.add(issue) : issues.delete(issue);
      reviews[key].issues = [...issues];
      if (checked && !reviews[key].status) reviews[key].status = "issue";
      reviews[key].reviewed_at = new Date().toISOString();
      save();
      updateProgress();
    }

    function updateNotes(job, value) {
      const key = jobKey(job);
      reviews[key] ||= {issues: []};
      reviews[key].notes = value;
      reviews[key].reviewed_at = new Date().toISOString();
      save();
    }

    function cardFor(job) {
      const key = jobKey(job);
      const review = reviews[key] || {};
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.status = review.status || "unreviewed";

      const titleRow = document.createElement("div");
      titleRow.className = "title-row";
      const heading = document.createElement("div");
      const eyebrow = document.createElement("div");
      eyebrow.className = "eyebrow";
      eyebrow.textContent = `${job.source} · ${job.source_id || job.id}`;
      const title = document.createElement("h2");
      title.textContent = escapeText(job.title);
      const company = document.createElement("div");
      company.className = "company";
      company.textContent = escapeText(job.company);
      heading.append(eyebrow, title, company);
      const link = document.createElement("a");
      link.className = "source-link";
      link.href = job.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "打开原岗位 ↗";
      titleRow.append(heading, link);

      const facts = document.createElement("div");
      facts.className = "facts";
      const values = [
        ["发布日期", job.date_posted],
        ["工作地点", job.workplace || job.prefecture_name],
        ["薪资", wageText(job)],
        ["雇佣类型", job.employment_type],
        ["远程", job.remote === true ? "是" : job.remote === false ? "否" : "—"],
        ["语言", (job.language || []).join(", ")],
        ["详情状态", job.detail_status],
        ["来源", (job.found_on || [job.source]).join(", ")]
      ];
      for (const [label, value] of values) {
        const fact = document.createElement("div");
        fact.className = "fact";
        const caption = document.createElement("span");
        caption.textContent = label;
        fact.append(caption, document.createTextNode(escapeText(value)));
        facts.appendChild(fact);
      }

      const description = document.createElement("div");
      description.className = "description";
      description.textContent = job.description_snippet || "没有描述摘要";

      const reviewPanel = document.createElement("div");
      reviewPanel.className = "review";
      const controls = document.createElement("div");
      const statusButtons = document.createElement("div");
      statusButtons.className = "status-buttons";
      for (const [value, label] of [["correct", "✓ 正确"], ["issue", "! 有问题"], ["unsure", "? 无法判断"]]) {
        const button = document.createElement("button");
        button.className = "status" + (review.status === value ? " selected" : "");
        button.dataset.value = value;
        button.textContent = label;
        button.onclick = () => setStatus(job, value);
        statusButtons.appendChild(button);
      }
      const issues = document.createElement("div");
      issues.className = "issues";
      for (const [value, label] of Object.entries(issueLabels)) {
        const wrapper = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = (review.issues || []).includes(value);
        input.onchange = event => updateIssue(job, value, event.target.checked);
        wrapper.append(input, document.createTextNode(" " + label));
        issues.appendChild(wrapper);
      }
      controls.append(statusButtons, issues);
      const notes = document.createElement("textarea");
      notes.placeholder = "可选：记录具体哪里不对……";
      notes.value = review.notes || "";
      notes.oninput = event => updateNotes(job, event.target.value);
      reviewPanel.append(controls, notes);

      card.append(titleRow, facts, description, reviewPanel);
      return card;
    }

    function filteredJobs() {
      const status = document.getElementById("statusFilter").value;
      return data.jobs.filter(job => {
        if (activeSource !== "all" && job.source !== activeSource) return false;
        const current = (reviews[jobKey(job)] || {}).status || "unreviewed";
        return status === "all" || current === status;
      });
    }

    function updateProgress() {
      const reviewed = data.jobs.filter(job => (reviews[jobKey(job)] || {}).status).length;
      const percent = data.jobs.length ? Math.round(reviewed / data.jobs.length * 100) : 0;
      document.getElementById("summary").textContent =
        `源文件：${data.source_path} · 共 ${data.total_kept} 条 · 抽样 ${data.jobs.length} 条 · 已检查 ${reviewed} 条（${percent}%）`;
      document.getElementById("progressBar").style.width = percent + "%";
    }

    function render() {
      renderTabs();
      updateProgress();
      const cards = document.getElementById("cards");
      cards.innerHTML = "";
      const jobs = filteredJobs();
      if (!jobs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = activeSource === "all" ? "当前筛选下没有岗位。" : "这个平台没有可抽检的岗位。";
        cards.appendChild(empty);
        return;
      }
      for (const job of jobs) cards.appendChild(cardFor(job));
    }

    document.getElementById("sourceFilter").onchange = event => {
      activeSource = event.target.value;
      render();
    };
    document.getElementById("statusFilter").onchange = render;
    document.getElementById("exportButton").onclick = () => {
      const output = {
        exported_at: new Date().toISOString(),
        scanned_at: data.scanned_at,
        source_path: data.source_path,
        sample_size: data.jobs.length,
        reviews
      };
      const blob = new Blob([JSON.stringify(output, null, 2)], {type: "application/json"});
      const anchor = document.createElement("a");
      anchor.href = URL.createObjectURL(blob);
      anchor.download = `jpjobs-audit-${(data.scanned_at || "result").slice(0, 10)}.json`;
      anchor.click();
      URL.revokeObjectURL(anchor.href);
    };
    document.getElementById("resetButton").onclick = () => {
      if (!confirm("确定清空这份抽检结果吗？")) return;
      reviews = {};
      save();
      render();
    };

    sourceOptions();
    render();
  </script>
</body>
